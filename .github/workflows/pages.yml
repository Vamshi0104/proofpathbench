name: Deploy ProofPath demo to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt
      - name: Stage the canonical Zenodo paper for Pages
        run: cp zenodo/PAPER.pdf docs/downloads/proofpath_benchmark.pdf
      - name: Run benchmark and website checks
        run: make checks
      - name: Verify generated test counts
        run: python scripts/generate_release_metadata.py --check
      - name: Verify publication files and links
        run: |
          python scripts/check_public_release.py --archive-only
          python scripts/check_website_release.py
          test -s docs/downloads/proofpath_benchmark.pdf
          test -s docs/downloads/proofpath_artifact.tar.gz
          test -s docs/downloads/CITATION.cff

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage the canonical Zenodo paper for Pages
        run: cp zenodo/PAPER.pdf docs/downloads/proofpath_benchmark.pdf
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
