[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "proofpath"
version = "0.0.1"
description = "Controlled evaluation of planning for independently verifiable external outcomes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Vamshi Krishna Madhavan", email = "vamshi-madhavan@outlook.com" },
]
dependencies = [
  "jsonschema>=4.23,<5",
  "numpy>=2.0,<3",
  "openai>=2.0,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.9,<3",
  "PyYAML>=6.0,<7",
  "scipy>=1.14,<2",
  "statsmodels>=0.14,<1",
  "typer>=0.12,<1",
]

[project.urls]
Homepage = "https://vamshi0104.github.io/proofpathbench/"
Repository = "https://github.com/Vamshi0104/proofpathbench"

[project.optional-dependencies]
plots = ["matplotlib>=3.9,<4", "seaborn>=0.13,<1"]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["proofpath"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
